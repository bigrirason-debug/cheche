name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jvm:
    name: JVM tests (common + desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon desktopTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  apk:
    name: Android APK (debug, sideload)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-36 build-tools;36.0.0" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble
        run: ./gradlew --no-daemon -Pplaten.android=true :app-android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: platen-android-debug-apk
          path: app-android/build/outputs/apk/debug/*.apk

  windows:
    name: Windows MSI/EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests on Windows (render/ui evidence)
        run: ./gradlew --no-daemon :core-render:desktopTest :ui:desktopTest --stacktrace
      - name: Package
        run: ./gradlew --no-daemon :app-desktop:packageMsi :app-desktop:packageExe --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: platen-windows
          path: |
            app-desktop/build/compose/binaries/main/msi/*.msi
            app-desktop/build/compose/binaries/main/exe/*.exe
